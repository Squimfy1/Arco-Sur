<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Cathedral · not read</title>
		<!--
			Shown when the wallet cannot be read at all: no key file (503) or
			the node not answering (502). The message is the server's own and
			never contains the key. A plain page on purpose: it must work even
			when nothing else does, so its few colours live here.
		-->
		<style>
			body { margin: 0; min-height: 100vh; display: grid; place-items: center;
				background: #0e0e0e; color: #ededed; font: 300 15px/1.55 system-ui, sans-serif; }
			main { max-width: 40rem; padding: 2rem 1.5rem; }
			p.product { margin: 0; color: #6a6a6a; font: 400 11px/1 ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
			h1 { font: 300 2rem/1.1 ui-monospace, monospace; color: #6a6a6a; margin: 0.75rem 0 1.25rem; }
			pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, monospace;
				padding: 1rem; border: 1px solid #262626; background: #000000; color: #c8c8c8; }
			a { display: inline-block; padding: 0.7rem 1.1rem; background: #ffffff; color: #000000; text-decoration: none; }
		</style>
	</head>
	<body>
		<main>
			<p class="product">Cathedral / wallet</p>
			<h1>The wallet could not be read (%sveltekit.status%)</h1>
			<pre>%sveltekit.error.message%</pre>
			<p><a href="/">Try again</a></p>
		</main>
	</body>
</html>
